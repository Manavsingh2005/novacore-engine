[project]
name = "novacore-engine"
version = "1.0.0"
description = "High-performance enterprise async microservice and AI task orchestrator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "telethon>=1.38.1",
    "aiosqlite>=0.20.0",
    "aiohttp>=3.9.0",
    "groq>=0.11.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "yt-dlp>=2024.10.0",
    "pillow>=10.2.0",
    "cryptography>=42.0.0",
    "psutil>=5.9.0",
    "edge-tts>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
